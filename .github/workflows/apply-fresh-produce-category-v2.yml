name: Apply fresh produce category patch v2

on:
  push:
    branches:
      - agent/fresh-produce-category-v2
    paths:
      - 'scripts/trigger_fresh_produce_category_v2.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fresh-produce-category-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_fresh_produce_category.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Products.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Replace candy category with fresh produce'
          git push
