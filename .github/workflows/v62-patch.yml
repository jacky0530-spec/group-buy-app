name: V62 patch

on:
  push:
    branches:
      - fix-incoming-complete-v62

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-incoming-complete-v62
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply V62 patch
        run: python3 scripts/v62_fix_incoming.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/v62_fix_incoming.py .github/workflows/v62-patch.yml
      - name: Commit V62
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && exit 0
          git commit -m "V62: preserve automatic supplier payment on incoming completion"
          git push origin HEAD:fix-incoming-complete-v62
