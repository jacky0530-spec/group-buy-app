name: Apply helper portal patch
on:
  push:
    branches:
      - agent/helper-portal
    paths:
      - scripts/trigger_helper_portal.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helper-portal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_helper_portal.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src firestore.rules
          git diff --cached --quiet || git commit -m "Add helper-only order entry portal"
          git push origin HEAD:agent/helper-portal
