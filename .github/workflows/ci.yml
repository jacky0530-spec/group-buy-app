name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Enforce Migration Registry
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="${{ github.event.before }}"
          fi
          CHANGED="$(git diff --name-only "$BASE"...HEAD 2>/dev/null || git diff --name-only HEAD^ HEAD)"
          echo "$CHANGED"
          # Layout.jsx may change only to display the app version/navigation label; it does not by itself
          # imply a database/API migration. All API/server/lib/page changes and other components remain guarded.
          CORE_CHANGED="$(echo "$CHANGED" | grep -E '^(api/|server/|src/lib/|src/pages/|src/components/)' | grep -v '^src/components/Layout.jsx$' || true)"
          if [ -n "$CORE_CHANGED" ]; then
            if ! echo "$CHANGED" | grep -qx 'src/migration-registry.json'; then
              echo 'ERROR: 核心功能或資料邏輯已變更，但 Migration Registry 未同步更新。'
              echo '請更新 src/migration-registry.json，記錄版本、資料庫/API 影響與 rollback。'
              exit 1
            fi
          fi
      - name: Sync dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync package lock [skip ci]"
            git push
          fi
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build
