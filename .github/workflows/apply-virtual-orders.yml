name: Apply virtual order patch
on:
  push:
    branches:
      - agent/virtual-orders
    paths:
      - scripts/trigger_virtual_orders.txt
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-orders
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_virtual_orders.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.js src/pages/Orders.jsx src/pages/Products.jsx src/pages/PendingProductReport.jsx src/pages/SupplierPayments.jsx src/pages/Reports.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m "Add virtual order workflow"
          git push origin HEAD:agent/virtual-orders
