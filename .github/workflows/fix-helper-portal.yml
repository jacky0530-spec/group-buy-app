name: Fix helper portal
on:
  push:
    branches:
      - agent/helper-portal
    paths:
      - scripts/trigger_helper_fix.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/helper-portal
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_helper_portal.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git diff --cached --quiet || git commit -m "Fix helper portal imports"
          git push origin HEAD:agent/helper-portal
