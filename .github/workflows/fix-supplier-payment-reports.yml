name: Fix supplier payment reports
on:
  push:
    branches: [agent/supplier-payment-batches]
    paths: ['scripts/trigger_fix_supplier_payment_reports.txt']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-payment-batches
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_supplier_payment_reports.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Reports.jsx
          git diff --cached --quiet || git commit -m 'Fix supplier payment report calculations'
          git push
