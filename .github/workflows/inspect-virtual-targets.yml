name: Inspect virtual order targets
on:
  push:
    branches:
      - agent/virtual-orders
    paths:
      - scripts/trigger_virtual_inspect.txt
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-orders
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_virtual_targets.py
