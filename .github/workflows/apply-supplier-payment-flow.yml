name: Apply supplier payment flow patch

on:
  push:
    branches:
      - agent/supplier-payment-flow
    paths:
      - 'scripts/trigger_supplier_payment_flow.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/supplier-payment-flow
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_supplier_payment_flow.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.js src/pages/Products.jsx src/pages/Orders.jsx src/pages/PendingProductReport.jsx src/pages/Reports.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Separate supplier payment from arrival flow'
          git push
