name: Apply product price options patch

on:
  push:
    branches:
      - agent/product-price-options

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/product-price-options
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: python scripts/patch_price_options.py
      - name: Validate
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run lint
          npm run build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.js src/pages/Products.jsx src/pages/Orders.jsx src/components/GroupedReceipt.jsx src/pages/PendingProductReport.jsx src/pages/Reports.jsx src/components/Layout.jsx
          git commit -m "Add product package price options"
          git push origin HEAD:agent/product-price-options
