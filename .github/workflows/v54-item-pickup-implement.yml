name: V54 item pickup implementation

on:
  push:
    branches:
      - feature-item-pickup-v54
    paths:
      - .github/workflows/v54-item-pickup-implement.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-item-pickup-v54
          fetch-depth: 0
      - name: Patch existing files
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def patch(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,1))

          path='api/neon-orders-runtime.js'
          patch(path,
          """      AND column_name IN ('released_qty','released_at','released_by_uid')`\n  const names=new Set(rows.map(r=>r.column_name))\n  if(!names.has('released_qty')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS released_qty integer NOT NULL DEFAULT 0`\n  if(!names.has('released_at')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS released_at timestamptz`\n  if(!names.has('released_by_uid')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS released_by_uid text`\n  releaseSchemaReady=true\n""",
          """      AND column_name IN ('released_qty','released_at','released_by_uid','picked_up_qty','picked_up_at','picked_up_by_uid')`\n  const names=new Set(rows.map(r=>r.column_name))\n  if(!names.has('released_qty')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS released_qty integer NOT NULL DEFAULT 0`\n  if(!names.has('released_at')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS released_at timestamptz`\n  if(!names.has('released_by_uid')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS released_by_uid text`\n  if(!names.has('picked_up_qty')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS picked_up_qty integer NOT NULL DEFAULT 0`\n  if(!names.has('picked_up_at')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS picked_up_at timestamptz`\n  if(!names.has('picked_up_by_uid')) await sql`ALTER TABLE order_items ADD COLUMN IF NOT EXISTS picked_up_by_uid text`\n  releaseSchemaReady=true\n""")
          patch(path,
          """    SELECT line_no,product_id,spec_package,spec_flavor,spec_color,spec_size,qty,original_qty,released_qty,released_at,released_by_uid\n    FROM order_items WHERE order_id=${orderId}`\n""",
          """    SELECT line_no,product_id,spec_package,spec_flavor,spec_color,spec_size,qty,original_qty,released_qty,released_at,released_by_uid,\n      picked_up_qty,picked_up_at,picked_up_by_uid\n    FROM order_items WHERE order_id=${orderId}`\n""")
          patch(path,
          """    const releasedBy=releasedQty>0?text(previous?.released_by_uid||item.released_by_uid):''\n    const salePrice=num(item.sale_price??item.price)\n""",
          """    const releasedBy=releasedQty>0?text(previous?.released_by_uid||item.released_by_uid):''\n    const pickedUpQty=Math.min(Math.max(0,qty-releasedQty),Math.max(0,Math.trunc(num(previous?.picked_up_qty??item.picked_up_qty))))\n    const pickedUpAt=pickedUpQty>0?(iso(previous?.picked_up_at)||iso(item.picked_up_at)||new Date().toISOString()):null\n    const pickedUpBy=pickedUpQty>0?text(previous?.picked_up_by_uid||item.picked_up_by_uid):''\n    const arrivedQty=Math.min(qty,Math.max(pickedUpQty,Math.max(0,Math.trunc(num(item.arrived_qty)))))\n    const salePrice=num(item.sale_price??item.price)\n""")
          patch(path,
          """        spec_package,spec_flavor,spec_color,spec_size,fulfillment_type,arrived_qty,arrived_at,released_qty,released_at,released_by_uid,supplier_payment_term,\n        supplier_paid_amount,supplier_payment_status,supplier_payment_refs,created_at,updated_at\n""",
          """        spec_package,spec_flavor,spec_color,spec_size,fulfillment_type,arrived_qty,arrived_at,released_qty,released_at,released_by_uid,\n        picked_up_qty,picked_up_at,picked_up_by_uid,supplier_payment_term,supplier_paid_amount,supplier_payment_status,supplier_payment_refs,created_at,updated_at\n""")
          patch(path,
          """        ${spec.package},${spec.flavor},${spec.color},${spec.size},${fulfillment(item.fulfillment_type||orderFulfillment)},\n        ${Math.max(0,Math.trunc(num(item.arrived_qty)))},${iso(item.arrived_at)},${releasedQty},${releasedAt},${releasedBy||null},${text(item.supplier_payment_term)||'manual'},\n        ${num(item.supplier_paid_amount)},${text(item.supplier_payment_status)||'unpaid'},${j(item.supplier_payment_refs)}::jsonb,\n""",
          """        ${spec.package},${spec.flavor},${spec.color},${spec.size},${fulfillment(item.fulfillment_type||orderFulfillment)},\n        ${arrivedQty},${iso(item.arrived_at)},${releasedQty},${releasedAt},${releasedBy||null},\n        ${pickedUpQty},${pickedUpAt},${pickedUpBy||null},${text(item.supplier_payment_term)||'manual'},\n        ${num(item.supplier_paid_amount)},${text(item.supplier_payment_status)||'unpaid'},${j(item.supplier_payment_refs)}::jsonb,\n""")
          patch(path,
          """  const current=await sql`SELECT line_no,qty,released_qty FROM order_items WHERE order_id=${order.id} ORDER BY line_no`\n""",
          """  const current=await sql`SELECT line_no,qty,released_qty,picked_up_qty FROM order_items WHERE order_id=${order.id} ORDER BY line_no`\n""")
          patch(path,
          """    const released=Math.min(qty,Math.max(0,Math.trunc(num(current[i].released_qty))))\n    const arrived=Math.min(qty,Math.max(released,Math.max(0,Math.trunc(num(incoming[i]?.arrived_qty)))))\n""",
          """    const released=Math.min(qty,Math.max(0,Math.trunc(num(current[i].released_qty))))\n    const picked=Math.min(Math.max(0,qty-released),Math.max(0,Math.trunc(num(current[i].picked_up_qty))))\n    const minimumArrived=released>0?qty:picked\n    const arrived=Math.min(qty,Math.max(minimumArrived,Math.max(0,Math.trunc(num(incoming[i]?.arrived_qty)))))\n""")
          patch(path,
          """    SELECT line_no,sale_price,cost_price,qty,arrived_qty,released_qty,supplier_paid_amount,supplier_payment_status\n""",
          """    SELECT line_no,sale_price,cost_price,qty,arrived_qty,released_qty,picked_up_qty,supplier_paid_amount,supplier_payment_status\n""")
          patch(path,
          """  const released=Math.max(0,Math.trunc(num(item.released_qty)))\n  if(nextQty<released) throw new Error(`此品項已有 ${released} 件標記已釋出，請先降低／取消釋出數量再降低訂購量`)\n""",
          """  const released=Math.max(0,Math.trunc(num(item.released_qty)))\n  const picked=Math.max(0,Math.trunc(num(item.picked_up_qty)))\n  if(nextQty<released+picked) throw new Error(`此品項已有 ${released} 件已釋出、${picked} 件已取貨，訂購量不可低於 ${released+picked} 件`)\n""")
          patch(path,
          """  const arrived=Math.min(nextQty,Math.max(released,Math.max(0,Math.trunc(num(item.arrived_qty)))))\n""",
          """  const arrived=Math.min(nextQty,Math.max(released>0?nextQty:picked,Math.max(0,Math.trunc(num(item.arrived_qty)))))\n""")
          patch(path,
          """    SELECT o.id AS order_id,o.status,o.fulfillment_type,oi.line_no,oi.product_name,oi.qty,oi.arrived_qty,oi.released_qty\n""",
          """    SELECT o.id AS order_id,o.status,o.fulfillment_type,oi.line_no,oi.product_name,oi.qty,oi.arrived_qty,oi.released_qty,oi.picked_up_qty\n""")
          patch(path,
          """  const releasedQty=Math.trunc(num(releasedQtyInput))\n  if(releasedQty<0||releasedQty>qty) throw new Error(`釋出數量必須介於 0～${qty} 件`)\n""",
          """  const releasedQty=Math.trunc(num(releasedQtyInput))\n  const picked=Math.min(qty,Math.max(0,Math.trunc(num(row.picked_up_qty))))\n  if(releasedQty<0||releasedQty>Math.max(0,qty-picked)) throw new Error(`釋出數量必須介於 0～${Math.max(0,qty-picked)} 件；已有 ${picked} 件已取貨`)\n""")
          anchor="""async function releaseStates(sql,ids){\n"""
          insert="""async function setItemPickup(sql,auth,legacyId,itemIndex,pickedQtyInput){\n  const id=text(legacyId)\n  const lineNo=Math.trunc(num(itemIndex))+1\n  if(!id||lineNo<1) throw new Error('缺少訂單品項')\n  const rows=await sql`\n    SELECT o.id AS order_id,o.status,o.archived,o.is_virtual,o.fulfillment_type,oi.line_no,oi.product_name,oi.qty,oi.arrived_qty,oi.released_qty,oi.picked_up_qty\n    FROM orders o JOIN order_items oi ON oi.order_id=o.id\n    WHERE o.legacy_id=${id} AND oi.line_no=${lineNo} LIMIT 1`\n  const row=rows[0]\n  if(!row) throw new Error('找不到訂單商品')\n  if(row.status==='cancelled') throw new Error('已取消訂單不可標記取貨')\n  if(row.archived===true) throw new Error('已封存訂單不可標記取貨')\n  if(row.is_virtual===true) throw new Error('虛擬訂單不可標記取貨')\n  if(row.fulfillment_type==='stock') throw new Error('現貨訂單不使用預購品項取貨功能')\n  const qty=Math.max(0,Math.trunc(num(row.qty)))\n  const arrived=Math.min(qty,Math.max(0,Math.trunc(num(row.arrived_qty))))\n  const released=Math.min(qty,Math.max(0,Math.trunc(num(row.released_qty))))\n  const maxPickup=Math.min(arrived,Math.max(0,qty-released))\n  const pickedQty=Math.trunc(num(pickedQtyInput))\n  if(pickedQty<0||pickedQty>maxPickup) throw new Error(`已取貨數量必須介於 0～${maxPickup} 件；目前到貨 ${arrived}/${qty}、已釋出 ${released}`)\n  const updated=await sql`\n    UPDATE order_items SET\n      picked_up_qty=${pickedQty},\n      picked_up_at=${pickedQty>0?new Date().toISOString():null},\n      picked_up_by_uid=${pickedQty>0?auth.uid:null},\n      updated_at=now()\n    WHERE order_id=${row.order_id} AND line_no=${lineNo}\n    RETURNING line_no,product_name,qty,arrived_qty,released_qty,picked_up_qty,picked_up_at,picked_up_by_uid`\n  await sql`UPDATE orders SET updated_at=now() WHERE id=${row.order_id}`\n  return updated[0]\n}\n\nasync function pickupStates(sql,ids){\n  const target=[...new Set((Array.isArray(ids)?ids:[]).map(text).filter(Boolean))]\n  if(!target.length)return[]\n  if(target.length>250) throw new Error('單次最多讀取 250 筆訂單取貨狀態')\n  return sql`\n    SELECT o.legacy_id AS id,oi.line_no,oi.picked_up_qty,oi.picked_up_at,oi.picked_up_by_uid\n    FROM orders o JOIN order_items oi ON oi.order_id=o.id\n    WHERE o.legacy_id=ANY(${target}::text[])\n    ORDER BY o.legacy_id,oi.line_no`\n}\n\n"""+anchor
          patch(path,anchor,insert)
          patch(path,
          """    if(action==='release_states') return res.status(200).json({ok:true,rows:await releaseStates(sql,req.body?.ids)})\n""",
          """    if(action==='release_states') return res.status(200).json({ok:true,rows:await releaseStates(sql,req.body?.ids)})\n    if(action==='pickup_states') return res.status(200).json({ok:true,rows:await pickupStates(sql,req.body?.ids)})\n""")
          patch(path,
          """    if(action==='set_item_release') return res.status(200).json({ok:true,result:await setItemRelease(sql,auth,req.body?.id,req.body?.item_index,req.body?.released_qty)})\n""",
          """    if(action==='set_item_release') return res.status(200).json({ok:true,result:await setItemRelease(sql,auth,req.body?.id,req.body?.item_index,req.body?.released_qty)})\n    if(action==='set_item_pickup') return res.status(200).json({ok:true,result:await setItemPickup(sql,auth,req.body?.id,req.body?.item_index,req.body?.picked_up_qty)})\n""")

          path='src/lib/enableNeonPrimaryOrderWrites.js'
          patch(path,
          """  OrdersAPI.setItemRelease=async function(id,item_index,released_qty=0){\n    return (await neonOrdersRuntime('set_item_release',{id,item_index,released_qty:Number(released_qty||0)}))?.result\n  }\n\n""",
          """  OrdersAPI.setItemRelease=async function(id,item_index,released_qty=0){\n    return (await neonOrdersRuntime('set_item_release',{id,item_index,released_qty:Number(released_qty||0)}))?.result\n  }\n\n  OrdersAPI.setItemPickup=async function(id,item_index,picked_up_qty=0){\n    return (await neonOrdersRuntime('set_item_pickup',{id,item_index,picked_up_qty:Number(picked_up_qty||0)}))?.result\n  }\n\n""")

          path='src/main.jsx'
          patch(path,
          """import './lib/enableNeonOrderRead.js'\nimport './lib/enableNeonPaymentRead.js'\n""",
          """import './lib/enableNeonOrderRead.js'\nimport './lib/enableNeonPickupReads.js'\nimport './lib/enableNeonPaymentRead.js'\n""")

          path='src/pages/PendingProductReportFiltered.jsx'
          marker="""function taipeiDateLabel(value) {\n"""
          picked="""function pickedUpPendingPage(page,status=''){\n  if(status!=='pending')return page\n  return {\n    ...page,\n    rows:(page?.rows||[]).map(order=>{\n      const items=(order.items||[]).map(item=>{\n        const qty=Math.max(0,Number(item?.qty||0))\n        const picked=Math.min(qty,Math.max(0,Number(item?.picked_up_qty||0)))\n        if(!(qty>0&&picked>0))return item\n        const remaining=Math.max(0,qty-picked)\n        if(!remaining)return null\n        const arrived=Math.min(qty,Math.max(0,Number(item?.arrived_qty||0)))\n        const price=Number(item.sale_price??item.price??0)\n        return {\n          ...item,\n          qty:remaining,\n          arrived_qty:Math.min(remaining,Math.max(0,arrived-picked)),\n          subtotal:price*remaining,\n          pickup_original_qty:qty,\n          pickup_picked_up_qty:picked,\n          picked_up_qty:0,\n        }\n      }).filter(Boolean)\n      return items.length?{...order,items}:null\n    }).filter(Boolean),\n  }\n}\n\n"""+marker
          patch(path,marker,picked)
          patch(path,
          """      const page = releasedPickupPage(await originalSearchPage(params),params?.status)\n""",
          """      const page = releasedPickupPage(pickedUpPendingPage(await originalSearchPage(params),params?.status),params?.status)\n""")
          patch(path,
          """  // V43/V44：已出貨商品依出貨日期分組；V45：已釋出品項仍顯示，但排除取貨應收小計。\n""",
          """  // V43/V44：已出貨商品依出貨日期分組；V45：已釋出品項仍顯示；V54：待出貨只顯示尚未取貨數量。\n""")

          path='src/App.jsx'
          patch(path,"""import { BrowserRouter, Routes, Route, Navigate } from 'react-router-dom'\n""","""import { BrowserRouter, Routes, Route, Navigate } from 'react-router-dom'\nimport { useState } from 'react'\n""")
          patch(path,"""import OrderReleaseManager from './components/OrderReleaseManager'\n""","""import OrderReleaseManager from './components/OrderReleaseManager'\nimport OrderPickupManager from './components/OrderPickupManager'\n""")
          patch(path,
          """function LandingRedirect(){ const { role } = useAuth(); return <Navigate to={role === 'helper' ? '/helper' : '/'} replace /> }\n\nexport default function App() {\n""",
          """function LandingRedirect(){ const { role } = useAuth(); return <Navigate to={role === 'helper' ? '/helper' : '/'} replace /> }\n\nfunction PendingReportWorkspace(){\n  const [refreshKey,setRefreshKey]=useState(0)\n  return <><OrderPickupManager onChanged={()=>setRefreshKey(v=>v+1)}/><PendingProductReport key={refreshKey}/></>\n}\n\nexport default function App() {\n""")
          patch(path,"""                  <Route path=\"pending-report\" element={<PendingProductReport />} />\n""","""                  <Route path=\"pending-report\" element={<PendingReportWorkspace />} />\n""")

          path='src/components/Layout.jsx'
          patch(path,
          """// 第53版：商品結單日改回日曆式選擇，但使用自製 React 日曆避免 iPad／Safari 原生日期選擇器卡住。\nconst APP_VERSION = '第53版｜2026/09/11'\n""",
          """// 第54版：新增預購品項層級已取貨數量，未出貨報表只保留尚待取貨／未到貨項目。\nconst APP_VERSION = '第54版｜2026/09/11'\n""")

          reg=Path('src/migration-registry.json')
          data=json.loads(reg.read_text())
          if not any(e.get('version')=='V54' for e in data.get('entries',[])):
              data['entries'].append({
                'version':'V54',
                'date':'2026-09-11',
                'type':'feature',
                'summary':'新增預購 order_items 品項層級已取貨數量；同一訂單可將已到貨且已交付的規格標記取貨，未出貨報表只保留尚未取貨或尚未到貨項目。',
                'database_changes':['order_items.picked_up_qty integer NOT NULL DEFAULT 0','order_items.picked_up_at timestamptz','order_items.picked_up_by_uid text'],
                'api_changes':['api/neon-orders-runtime.js: pickup_states / set_item_pickup；沿用既有 Function，不新增 Serverless Function'],
                'ui_changes':['src/components/OrderPickupManager.jsx','src/pages/PendingProductReportFiltered.jsx','/pending-report 掛載品項取貨管理'],
                'data_logic':'已取貨數量不得超過已到貨且未釋出數量；取貨不修改原始銷售額、成本、供應商付款或庫存流水。未出貨報表只扣除 picked_up_qty 的顯示量；原訂單與 order_items 仍保留完整歷史。',
                'data_migration':'新增欄位皆有安全預設值；既有資料 picked_up_qty=0，不自動改寫既有訂單。',
                'rollback':'停用 V54 UI/讀取包裝與 set_item_pickup action；保留新增欄位亦不影響舊版本。若確定無資料才可另行移除欄位。'
              })
          reg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

          cat > src/lib/enableNeonPickupReads.js <<'EOF'
          import { OrdersAPI } from './db'
          import { neonOrdersRuntime } from './neonRuntime'

          const INSTALLED=Symbol.for('group-buy.neon-pickup-reads-installed')

          if(!globalThis[INSTALLED]){
            globalThis[INSTALLED]=true
            const originalSearchPage=OrdersAPI.searchPage.bind(OrdersAPI)
            OrdersAPI.searchPage=async function(params={}){
              const page=await originalSearchPage(params)
              const rows=Array.isArray(page?.rows)?page.rows:[]
              const ids=[...new Set(rows.map(row=>String(row?.id||'').trim()).filter(Boolean))]
              if(!ids.length)return page
              const states=await neonOrdersRuntime('pickup_states',{ids})
              const map=new Map()
              ;(states?.rows||[]).forEach(state=>{
                map.set(`${state.id}:${Number(state.line_no)-1}`,state)
              })
              return {
                ...page,
                rows:rows.map(order=>({
                  ...order,
                  items:(order.items||[]).map((item,index)=>{
                    const state=map.get(`${order.id}:${index}`)
                    return state?{
                      ...item,
                      picked_up_qty:Number(state.picked_up_qty||0),
                      picked_up_at:state.picked_up_at||null,
                      picked_up_by_uid:state.picked_up_by_uid||'',
                    }:item
                  }),
                })),
              }
            }
          }
          EOF

          cat > src/components/OrderPickupManager.jsx <<'EOF'
          import { useMemo, useState } from 'react'
          import { Minus, PackageCheck, Plus, Search } from 'lucide-react'
          import { OrdersAPI } from '../lib/db'
          import { ConfirmDialog, useToast } from './UI'

          const qty=value=>Math.max(0,Math.trunc(Number(value)||0))
          const money=value=>`NT$${Math.round(Number(value||0)).toLocaleString()}`

          function specText(item){
            const s=item?.spec||{}
            return [s.package&&`組合：${s.package}`,s.flavor&&`口味：${s.flavor}`,s.color&&`顏色：${s.color}`,s.size&&`尺寸：${s.size}`].filter(Boolean).join('／')||'一般規格'
          }

          async function fetchMatchingPending(search){
            const rows=[]
            let cursor=null
            let guard=0
            do{
              const page=await OrdersAPI.searchPage({status:'pending',includeArchived:false,search,pageSize:250,cursor})
              rows.push(...(page.rows||[]))
              cursor=page.hasMore?page.nextCursor:null
              guard+=1
            }while(cursor&&guard<30)
            return rows
          }

          export default function OrderPickupManager({onChanged}){
            const toast=useToast()
            const [open,setOpen]=useState(true)
            const [search,setSearch]=useState('')
            const [orders,setOrders]=useState([])
            const [loading,setLoading]=useState(false)
            const [busy,setBusy]=useState('')
            const [confirm,setConfirm]=useState(null)
            const [drafts,setDrafts]=useState({})

            async function load(){
              const q=search.trim()
              if(!q){setOrders([]);toast('請先輸入客戶姓名、末碼或商品名稱','warning');return}
              setLoading(true)
              try{
                setOrders(await fetchMatchingPending(q))
                setDrafts({})
              }catch(err){toast('取貨資料載入失敗：'+err.message,'error')}
              finally{setLoading(false)}
            }

            const rows=useMemo(()=>{
              const result=[]
              orders.forEach(order=>{
                if(order.is_virtual||order.fulfillment_type==='stock'||order.archived===true)return
                ;(order.items||[]).forEach((item,itemIndex)=>{
                  const ordered=qty(item.qty)
                  const arrived=Math.min(ordered,qty(item.arrived_qty))
                  const released=Math.min(ordered,qty(item.released_qty))
                  const picked=Math.min(Math.max(0,ordered-released),qty(item.picked_up_qty))
                  const maxPickup=Math.min(arrived,Math.max(0,ordered-released))
                  if(!(ordered>0&&maxPickup>0))return
                  result.push({order,item,itemIndex,ordered,arrived,released,picked,maxPickup})
                })
              })
              return result.sort((a,b)=>{
                if((a.picked>=a.maxPickup)!==(b.picked>=b.maxPickup))return a.picked>=a.maxPickup?1:-1
                return String(a.order.customer_name||'').localeCompare(String(b.order.customer_name||''),'zh-Hant',{numeric:true})
              })
            },[orders])

            function keyOf(order,itemIndex){return `${order.id}:${itemIndex}`}
            function draftValue(row){
              const key=keyOf(row.order,row.itemIndex)
              if(Object.prototype.hasOwnProperty.call(drafts,key))return String(drafts[key]??'')
              return String(row.picked>0?row.picked:Math.min(1,row.maxPickup))
            }
            function normalizedDraft(row){
              const value=Math.trunc(Number(draftValue(row)))
              if(!Number.isFinite(value))return row.picked
              return Math.max(0,Math.min(row.maxPickup,value))
            }
            function setDraft(row,value){
              const key=keyOf(row.order,row.itemIndex)
              const next=Math.max(0,Math.min(row.maxPickup,Math.trunc(Number(value)||0)))
              setDrafts(prev=>({...prev,[key]:String(next)}))
            }
            function changeDraft(row,value){
              const key=keyOf(row.order,row.itemIndex)
              const digits=String(value||'').replace(/\D/g,'')
              setDrafts(prev=>({...prev,[key]:digits}))
            }
            function request(row,next){
              if(next===row.picked){toast('已取貨數量沒有變更','warning');return}
              setConfirm({...row,nextPicked:next})
            }
            async function apply(){
              const row=confirm
              if(!row||busy)return
              const key=keyOf(row.order,row.itemIndex)
              setConfirm(null);setBusy(key)
              try{
                await OrdersAPI.setItemPickup(row.order.id,row.itemIndex,row.nextPicked)
                toast(row.nextPicked>0?`✅ 已取貨 ${row.nextPicked}/${row.ordered} 件`:'↩️ 已取消此品項取貨標記')
                await load()
                onChanged?.()
              }catch(err){toast('更新已取貨狀態失敗：'+err.message,'error')}
              finally{setBusy('')}
            }

            return <>
              {confirm&&<ConfirmDialog
                message={confirm.nextPicked>0
                  ? `確定將「${confirm.item.product_name||confirm.item.name||'商品'}」標記已取貨 ${confirm.nextPicked}/${confirm.ordered} 件？\n\n只有已到貨商品可取貨；此操作不修改原始銷售額、成本、供應商付款或庫存資料。`
                  : `確定取消「${confirm.item.product_name||confirm.item.name||'商品'}」的已取貨標記？\n\n取消後會重新出現在未出貨報表。`}
                onCancel={()=>setConfirm(null)}
                onConfirm={apply}
              />}
              <div className="card no-print" style={{marginBottom:16,border:'1px solid #86efac'}}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,flexWrap:'wrap',padding:'12px 14px'}}>
                  <div>
                    <strong style={{display:'flex',alignItems:'center',gap:7}}><PackageCheck size={17}/>品項取貨管理</strong>
                    <div style={{fontSize:12,color:'var(--text-muted)',marginTop:4}}>同一張訂單可逐尺寸／規格標記已取貨；已取貨品項會從下方未出貨報表扣除，只留下尚未取貨或未到貨項目。</div>
                  </div>
                  <button type="button" className="btn btn-sm btn-ghost" onClick={()=>setOpen(v=>!v)}>{open?'收合':'開啟'}</button>
                </div>
                {open&&<div style={{borderTop:'1px solid var(--border)',padding:'12px 14px 14px'}}>
                  <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:12}}>
                    <div className="search-input-wrap" style={{flex:'1 1 340px',height:48,padding:'0 14px',display:'flex',alignItems:'center',gap:10,border:'1px solid var(--border)',borderRadius:10,background:'var(--surface)'}}>
                      <Search size={20}/>
                      <input value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')load()}} placeholder="搜尋客戶姓名／手機末碼／商品名稱..." style={{flex:1,minWidth:0,height:'100%',border:0,outline:'none',background:'transparent',fontSize:16,padding:'0 4px'}}/>
                    </div>
                    <button type="button" className="btn btn-primary" style={{height:48,minWidth:92}} disabled={loading} onClick={load}>{loading?'查詢中...':'查詢'}</button>
                  </div>
                  {!loading&&search.trim()&&rows.length===0&&<div style={{padding:14,color:'var(--text-muted)'}}>沒有可標記取貨的已到貨品項。</div>}
                  {!loading&&rows.map(row=>{
                    const key=keyOf(row.order,row.itemIndex)
                    const draft=normalizedDraft(row)
                    const raw=draftValue(row)
                    const done=row.picked>=row.maxPickup
                    const price=Number(row.item.sale_price??row.item.price??0)
                    return <div key={key} style={{display:'grid',gridTemplateColumns:'minmax(140px,1fr) minmax(280px,2fr) minmax(210px,auto) minmax(130px,auto)',gap:10,alignItems:'center',padding:'11px 0',borderTop:'1px solid var(--border)',opacity:done?.72:1}}>
                      <div><strong>{row.order.customer_name||'未命名客戶'}</strong>{row.order.customer_phone_last2&&<span className="badge badge-violet" style={{marginLeft:6}}>末碼 {row.order.customer_phone_last2}</span>}<div style={{fontSize:11,color:'var(--text-muted)',marginTop:3}}>待出貨正式訂單</div></div>
                      <div><strong>{row.item.product_name||row.item.name}</strong> ×{row.ordered}<div style={{fontSize:12,color:'#2563eb',fontWeight:800,marginTop:3}}>{specText(row.item)}</div><div style={{fontSize:11,color:'var(--text-muted)',marginTop:3}}>已到 {row.arrived}/{row.ordered}　已釋出 {row.released}　已取貨 {row.picked}　未取貨 {Math.max(0,row.ordered-row.released-row.picked)}　{money(price)}/件</div></div>
                      <div style={{display:'flex',alignItems:'center',gap:5,justifyContent:'flex-end',flexWrap:'wrap'}}>
                        <button type="button" aria-label="取貨數量減一" onClick={()=>setDraft(row,draft-1)} disabled={draft<=0||Boolean(busy)} style={{width:44,height:48,border:'1px solid var(--border)',borderRadius:10,background:'var(--surface)',display:'grid',placeItems:'center'}}><Minus size={18}/></button>
                        <input type="text" inputMode="numeric" value={raw} onFocus={e=>e.currentTarget.select()} onChange={e=>changeDraft(row,e.target.value)} onBlur={()=>setDraft(row,draft)} aria-label={`已取貨數量，最多 ${row.maxPickup} 件`} style={{width:78,height:48,fontSize:18,fontWeight:900,textAlign:'center',padding:'0 8px',border:'2px solid #16a34a',borderRadius:10,background:'var(--surface)'}}/>
                        <button type="button" aria-label="取貨數量加一" onClick={()=>setDraft(row,draft+1)} disabled={draft>=row.maxPickup||Boolean(busy)} style={{width:44,height:48,border:'1px solid var(--border)',borderRadius:10,background:'var(--surface)',display:'grid',placeItems:'center'}}><Plus size={18}/></button>
                        <span style={{fontSize:12,fontWeight:800}}>最多 {row.maxPickup}</span>
                      </div>
                      <div style={{display:'flex',gap:6,justifyContent:'flex-end',flexWrap:'wrap'}}>
                        <button type="button" className="btn btn-sm btn-primary" disabled={Boolean(busy)||draft===row.picked} onClick={()=>request(row,draft)}>{busy===key?'處理中...':done?'修改取貨':'標記已取貨'}</button>
                        {row.picked>0&&<button type="button" className="btn btn-sm btn-ghost" disabled={Boolean(busy)} onClick={()=>request(row,0)}>取消取貨</button>}
                      </div>
                    </div>
                  })}
                </div>}
              </div>
            </>
          }
          EOF

