name: Apply shipped report archive patch

on:
  push:
    branches:
      - agent/shipped-report-archive
    paths:
      - 'scripts/trigger_shipped_report_archive.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/shipped-report-archive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_shipped_archive_report.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PendingProductReport.jsx src/lib/db.js src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Add archive controls to shipped report'
          git push
