name: Fix bulk delete local date

on:
  push:
    branches:
      - agent/bulk-delete-orders
    paths:
      - scripts/trigger_bulk_delete_local_date.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-delete-orders
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python scripts/fix_bulk_delete_local_date.py
      - run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Orders.jsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Use local date for order filtering"
            git push origin HEAD:agent/bulk-delete-orders
          fi
