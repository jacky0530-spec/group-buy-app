name: Apply combo summary polish

on:
  push:
    branches:
      - agent/combo-summary-display
    paths:
      - 'scripts/trigger_combo_summary_polish.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/combo-summary-display
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply polish
        run: python scripts/patch_combo_summary_polish.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PendingProductReport.jsx
          git diff --cached --quiet || git commit -m 'Polish combo summary styling'
          git push
