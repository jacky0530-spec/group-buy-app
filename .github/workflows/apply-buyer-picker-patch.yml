name: Apply buyer picker patch

on:
  push:
    branches:
      - agent/buyer-picker-report

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/buyer-picker-report
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: python scripts/patch_buyer_picker.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PendingProductReport.jsx src/components/Layout.jsx
          git commit -m "Add buyer picker to shipment report"
          git push origin HEAD:agent/buyer-picker-report
