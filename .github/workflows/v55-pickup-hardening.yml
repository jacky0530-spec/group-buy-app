name: V55 pickup hardening

on:
  push:
    branches:
      - fix-pickup-flow-v55
    paths:
      - .github/workflows/v55-pickup-hardening.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pickup-flow-v55
          fetch-depth: 0
      - name: Harden pickup flow
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          def patch(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:150]!r}')
              p.write_text(s.replace(old,new,1))

          # 1) Pickup manager must bypass the report's presentation-only global search wrapper.
          path='src/components/OrderPickupManager.jsx'
          patch(path,
            "import { useMemo, useState } from 'react'",
            "import { useMemo, useRef, useState } from 'react'")
          patch(path,
            "async function fetchMatchingPending(search){",
            "async function fetchMatchingPending(searchPage,search){")
          patch(path,
            "    const page=await OrdersAPI.searchPage({status:'pending',includeArchived:false,search,pageSize:250,cursor})",
            "    const page=await searchPage({status:'pending',includeArchived:false,search,pageSize:250,cursor})")
          patch(path,
            "  const toast=useToast()\n  const [open,setOpen]=useState(true)",
            "  const toast=useToast()\n  const searchPageRef=useRef(OrdersAPI.searchPage)\n  const [open,setOpen]=useState(true)")
          patch(path,
            "      setOrders(await fetchMatchingPending(q))",
            "      setOrders(await fetchMatchingPending(searchPageRef.current,q))")
          patch(path,
            "      await OrdersAPI.setItemPickup(row.order.id,row.itemIndex,row.nextPicked)\n      toast(row.nextPicked>0?`✅ 已取貨 ${row.nextPicked}/${row.ordered} 件`:'↩️ 已取消此品項取貨標記')",
            "      const result=await OrdersAPI.setItemPickup(row.order.id,row.itemIndex,row.nextPicked)\n      toast(result?.order_completed?'✅ 本張訂單所有有效品項已完成，已自動標記已出貨':row.nextPicked>0?`✅ 已取貨 ${row.nextPicked}/${row.ordered} 件`:'↩️ 已取消此品項取貨標記')")

          # 2) Preserve original order_item index through presentation filtering, otherwise a removed picked line shifts later indices.
          path='src/pages/PendingProductReportFiltered.jsx'
          old="""      const items=(order.items||[]).map(item=>{\n        const qty=Math.max(0,Number(item?.qty||0))\n        const picked=Math.min(qty,Math.max(0,Number(item?.picked_up_qty||0)))\n        if(!(qty>0&&picked>0))return item\n        const remaining=Math.max(0,qty-picked)\n        if(!remaining)return null\n        const arrived=Math.min(qty,Math.max(0,Number(item?.arrived_qty||0)))\n        const price=Number(item.sale_price??item.price??0)\n        return {\n          ...item,\n          qty:remaining,\n          arrived_qty:Math.min(remaining,Math.max(0,arrived-picked)),\n          subtotal:price*remaining,\n          pickup_original_qty:qty,\n          pickup_picked_up_qty:picked,\n          picked_up_qty:0,\n        }\n      }).filter(Boolean)\n"""
          new="""      const items=(order.items||[]).map((item,sourceIndex)=>{\n        const sourceItemIndex=Number.isInteger(Number(item?._source_item_index))?Number(item._source_item_index):sourceIndex\n        const qty=Math.max(0,Number(item?.qty||0))\n        const picked=Math.min(qty,Math.max(0,Number(item?.picked_up_qty||0)))\n        if(!(qty>0&&picked>0))return {...item,_source_item_index:sourceItemIndex}\n        const remaining=Math.max(0,qty-picked)\n        if(!remaining)return null\n        const arrived=Math.min(qty,Math.max(0,Number(item?.arrived_qty||0)))\n        const price=Number(item.sale_price??item.price??0)\n        return {\n          ...item,\n          _source_item_index:sourceItemIndex,\n          qty:remaining,\n          arrived_qty:Math.min(remaining,Math.max(0,arrived-picked)),\n          subtotal:price*remaining,\n          pickup_original_qty:qty,\n          pickup_picked_up_qty:picked,\n          picked_up_qty:0,\n        }\n      }).filter(Boolean)\n"""
          patch(path,old,new)

          # 3) Pending report uses original item index and locks quantity edits after pickup history exists.
          path='src/pages/PendingProductReportSql.jsx'
          old="""      detail.qty+=shown;detail.ordered_qty+=ordered;detail.arrived_qty+=arrived;detail.missing_qty+=missing;detail.amount+=price*shown;detail.dates.add(dateText(order.order_date));detail.sources.push({order_id:order.id,item_index:(order.items||[]).indexOf(item),qty:ordered,date:dateText(order.order_date),is_virtual:Boolean(order.is_virtual)})\n"""
          new="""      const sourceItemIndex=Number.isInteger(Number(item?._source_item_index))?Number(item._source_item_index):(order.items||[]).indexOf(item)\n      const originalQty=Math.max(ordered,Number(item?.pickup_original_qty||ordered))\n      const pickedQty=Math.max(0,Number(item?.pickup_picked_up_qty||0))\n      detail.qty+=shown;detail.ordered_qty+=ordered;detail.arrived_qty+=arrived;detail.missing_qty+=missing;detail.amount+=price*shown;detail.dates.add(dateText(order.order_date));detail.sources.push({order_id:order.id,item_index:sourceItemIndex,qty:originalQty,picked_up_qty:pickedQty,locked_after_pickup:pickedQty>0,date:dateText(order.order_date),is_virtual:Boolean(order.is_virtual)})\n"""
          patch(path,old,new)
          old="""{shipmentView==='pending'&&item.sources.map(source=><div key={`${source.order_id}-${source.item_index}`} style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap',marginTop:5,padding:'5px 7px',borderRadius:7,background:source.is_virtual?'#fff1f2':'#f8fafc'}}><span className={`badge ${source.is_virtual?'badge-rose':'badge-gray'}`}>{source.is_virtual?'⚠ 虛擬':'正式'}</span><span style={{fontSize:11}}>訂購量</span><input type=\"number\" min=\"1\" defaultValue={source.qty} onKeyDown={e=>{if(e.key==='Enter')e.currentTarget.blur()}} onBlur={e=>changeSourceQty(source,e.target.value)} style={{width:72,padding:'6px',fontWeight:900,textAlign:'center'}}/></div>)}"""
          new="""{shipmentView==='pending'&&item.sources.map(source=><div key={`${source.order_id}-${source.item_index}`} style={{display:'flex',gap:7,alignItems:'center',flexWrap:'wrap',marginTop:5,padding:'5px 7px',borderRadius:7,background:source.is_virtual?'#fff1f2':'#f8fafc'}}><span className={`badge ${source.is_virtual?'badge-rose':'badge-gray'}`}>{source.is_virtual?'⚠ 虛擬':'正式'}</span>{source.locked_after_pickup?<><span className=\"badge badge-emerald\">已取貨 {source.picked_up_qty}</span><span style={{fontSize:11}}>原訂購量 {source.qty}（已有取貨紀錄，請勿直接改量）</span></>:<><span style={{fontSize:11}}>訂購量</span><input type=\"number\" min=\"1\" defaultValue={source.qty} onKeyDown={e=>{if(e.key==='Enter')e.currentTarget.blur()}} onBlur={e=>changeSourceQty(source,e.target.value)} style={{width:72,padding:'6px',fontWeight:900,textAlign:'center'}}/></>}</div>)}"""
          patch(path,old,new)

          # 4) When every effective line is picked/released, complete the whole preorder order atomically.
          path='api/neon-orders-runtime.js'
          old="""  await sql`UPDATE orders SET updated_at=now() WHERE id=${row.order_id}`\n  return updated[0]\n}\n\nasync function pickupStates(sql,ids){\n"""
          new="""  const state=await sql`\n    SELECT COUNT(*)::int AS item_count,\n      COUNT(*) FILTER (WHERE COALESCE(released_qty,0)+COALESCE(picked_up_qty,0)<qty)::int AS open_items\n    FROM order_items WHERE order_id=${row.order_id}`\n  const completed=Number(state[0]?.item_count||0)>0&&Number(state[0]?.open_items||0)===0\n  let orderCompleted=false\n  if(completed&&row.status==='pending'){\n    const completedAt=new Date().toISOString()\n    const historyEntry=[{status:'shipped',at:completedAt,note:'所有有效品項已取貨／釋出，自動完成訂單'}]\n    await sql`\n      UPDATE orders SET status='shipped',shipped_at=COALESCE(shipped_at,${completedAt}),\n        status_history=COALESCE(status_history,'[]'::jsonb) || ${JSON.stringify(historyEntry)}::jsonb,updated_at=now()\n      WHERE id=${row.order_id}`\n    orderCompleted=true\n  }else{\n    await sql`UPDATE orders SET updated_at=now() WHERE id=${row.order_id}`\n  }\n  return {...updated[0],order_completed:orderCompleted}\n}\n\nasync function pickupStates(sql,ids){\n"""
          patch(path,old,new)

          # 5) Version + migration registry.
          path='src/components/Layout.jsx'
          patch(path,
            "// 第54版：新增預購品項層級已取貨數量，未出貨報表只保留尚待取貨／未到貨項目。\nconst APP_VERSION = '第54版｜2026/09/11'",
            "// 第55版：加強取貨流程，保留原品項索引、避免取貨後誤改訂購量，全部完成時自動完成訂單。\nconst APP_VERSION = '第55版｜2026/09/12'")

          reg=Path('src/migration-registry.json')
          data=json.loads(reg.read_text())
          if not any(e.get('version')=='V55' for e in data.get('entries',[])):
              data['entries'].append({
                'version':'V55',
                'date':'2026-09-12',
                'type':'bugfix/workflow',
                'summary':'加固 V54 品項取貨流程：取貨管理使用未經未出貨報表展示轉換的原始 Neon 訂單資料；待出貨展示保留原 order_item 索引，避免已取貨品項被隱藏後造成後續規格 item_index 位移；有取貨紀錄的品項在報表鎖定訂購量直接修改；所有有效品項均已取貨或釋出時，自動將整張預購訂單完成為 shipped。',
                'database_changes':[],
                'api_changes':['api/neon-orders-runtime.js: set_item_pickup 完成後檢查整張訂單剩餘有效品項，全部完成時更新 orders.status/shipped_at/status_history'],
                'ui_changes':['OrderPickupManager 固定使用原始 searchPage，避免被 PendingProductReportFiltered 的展示 wrapper 影響','PendingProductReportFiltered 保留 _source_item_index','PendingProductReportSql 已取貨來源列鎖定訂購量編輯'],
                'data_logic':'部分取貨不改整張訂單狀態；仍有未到貨/未取貨項目時維持 pending。僅當每一 order_item 都滿足 released_qty + picked_up_qty >= qty 時，pending 預購訂單才自動轉 shipped。',
                'data_migration':'無新增欄位；沿用 V54 picked_up_* 欄位。',
                'rollback':'還原 V55 前端索引/編輯保護與 set_item_pickup 自動完成段落；不需 schema rollback。'
              })
          reg.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY

          rm .github/workflows/v55-pickup-hardening.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add api/neon-orders-runtime.js src/components/OrderPickupManager.jsx src/pages/PendingProductReportFiltered.jsx src/pages/PendingProductReportSql.jsx src/components/Layout.jsx src/migration-registry.json .github/workflows/v55-pickup-hardening.yml
          git commit -m "V55: harden item pickup workflow"
          git push origin HEAD:fix-pickup-flow-v55
