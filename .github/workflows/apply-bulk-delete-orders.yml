name: Apply bulk delete orders patch

on:
  push:
    branches:
      - agent/bulk-delete-orders
    paths:
      - scripts/trigger_bulk_delete_orders.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bulk-delete-orders
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python scripts/patch_bulk_delete_orders.py
      - name: Verify
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/db.js src/pages/Orders.jsx src/components/OrderDeleteButton.jsx src/components/Layout.jsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add filtered bulk order deletion"
            git push origin HEAD:agent/bulk-delete-orders
          fi
