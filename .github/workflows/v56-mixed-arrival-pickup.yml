name: V56 mixed arrival pickup fix

on:
  push:
    branches:
      - fix-mixed-arrival-pickup-v56

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch mixed-arrival pickup UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path('src/pages/PendingProductReportSql.jsx')
          text = path.read_text()

          old = """      const sourceItemIndex=Number.isInteger(Number(item?._source_item_index))?Number(item._source_item_index):(order.items||[]).indexOf(item)\n      const originalQty=Math.max(ordered,Number(item?.pickup_original_qty||ordered))\n      const pickedQty=Math.max(0,Number(item?.pickup_picked_up_qty||0))\n      detail.qty+=shown;detail.ordered_qty+=ordered;detail.arrived_qty+=arrived;detail.missing_qty+=missing;detail.amount+=price*shown;detail.dates.add(dateText(order.order_date));detail.sources.push({order_id:order.id,item_index:sourceItemIndex,qty:originalQty,picked_up_qty:pickedQty,locked_after_pickup:pickedQty>0,date:dateText(order.order_date),is_virtual:Boolean(order.is_virtual)})\n"""
          new = """      const sourceItemIndex=Number.isInteger(Number(item?._source_item_index))?Number(item._source_item_index):(order.items||[]).indexOf(item)\n      const originalQty=Math.max(ordered,Number(item?.pickup_original_qty||ordered))\n      const pickedQty=Math.max(0,Number(item?.pickup_picked_up_qty||0))\n      const releasedQty=Math.max(0,Number(item?.pickup_released_qty??item?.released_qty??0))\n      const pickupTarget=Math.max(0,originalQty-releasedQty)\n      const canPickup=!order.is_virtual&&pickupTarget>0&&pickedQty===0&&arrived>=pickupTarget\n      detail.qty+=shown;detail.ordered_qty+=ordered;detail.arrived_qty+=arrived;detail.missing_qty+=missing;detail.amount+=price*shown;detail.dates.add(dateText(order.order_date));detail.sources.push({order_id:order.id,item_index:sourceItemIndex,qty:originalQty,arrived_qty:arrived,released_qty:releasedQty,pickup_target:pickupTarget,can_pickup:canPickup,picked_up_qty:pickedQty,locked_after_pickup:pickedQty>0,date:dateText(order.order_date),is_virtual:Boolean(order.is_virtual)})\n"""
          if old not in text:
              raise SystemExit('source detail block not found')
          text = text.replace(old, new, 1)

          old = """  const [mode,setMode]=useState('buyer'),[shipmentView,setShipmentView]=useState('shipped'),[arrivalView,setArrivalView]=useState('all'),[productSearch,setProductSearch]=useState(''),[selectedProduct,setSelectedProduct]=useState(null),[productBuyerSearch,setProductBuyerSearch]=useState(''),[buyerSearch,setBuyerSearch]=useState(''),[selectedBuyerKey,setSelectedBuyerKey]=useState(''),[showArchived,setShowArchived]=useState(false),[marking,setMarking]=useState(false),[shippingKey,setShippingKey]=useState(''),[archivingKey,setArchivingKey]=useState('')\n"""
          new = """  const [mode,setMode]=useState('buyer'),[shipmentView,setShipmentView]=useState('shipped'),[arrivalView,setArrivalView]=useState('all'),[productSearch,setProductSearch]=useState(''),[selectedProduct,setSelectedProduct]=useState(null),[productBuyerSearch,setProductBuyerSearch]=useState(''),[buyerSearch,setBuyerSearch]=useState(''),[selectedBuyerKey,setSelectedBuyerKey]=useState(''),[showArchived,setShowArchived]=useState(false),[marking,setMarking]=useState(false),[shippingKey,setShippingKey]=useState(''),[archivingKey,setArchivingKey]=useState(''),[pickupKey,setPickupKey]=useState('')\n"""
          if old not in text:
              raise SystemExit('state block not found')
          text = text.replace(old, new, 1)

          marker = """  async function changeSourceQty(source,value){const qty=Number(value);if(!Number.isInteger(qty)||qty<1||qty===Number(source.qty))return;try{await OrdersAPI.updateItemQty(source.order_id,source.item_index,qty);toast(`訂購量已更新為 ${qty} ✓`);await refresh()}catch(err){toast('修改訂購量失敗：'+err.message,'error')}finally{setShippingKey('')}}\n"""
          # Current implementation intentionally has no finally on changeSourceQty; use the exact real line below.
          marker = """  async function changeSourceQty(source,value){const qty=Number(value);if(!Number.isInteger(qty)||qty<1||qty===Number(source.qty))return;try{await OrdersAPI.updateItemQty(source.order_id,source.item_index,qty);toast(`訂購量已更新為 ${qty} ✓`);await refresh()}catch(err){toast('修改訂購量失敗：'+err.message,'error')}\n"""
          addition = marker + """  async function markSourcePickedUp(source){\n    if(!source?.can_pickup||pickupKey)return\n    const key=`${source.order_id}-${source.item_index}`\n    setPickupKey(key)\n    try{\n      await OrdersAPI.setItemPickup(source.order_id,source.item_index,source.pickup_target)\n      toast(`✅ 已取貨 ${source.pickup_target} 件，已從未出貨明細隱藏`)\n      await refresh()\n    }catch(err){toast('標記取貨失敗：'+err.message,'error')}finally{setPickupKey('')}\n  }\n"""
          if marker not in text:
              raise SystemExit('changeSourceQty marker not found')
          text = text.replace(marker, addition, 1)

          old = """{source.locked_after_pickup?<><span className=\"badge badge-emerald\">已取貨 {source.picked_up_qty}</span><span style={{fontSize:11}}>原訂購量 {source.qty}（已有取貨紀錄，請勿直接改量）</span></>:<><span style={{fontSize:11}}>訂購量</span><input type=\"number\" min=\"1\" defaultValue={source.qty} onKeyDown={e=>{if(e.key==='Enter')e.currentTarget.blur()}} onBlur={e=>changeSourceQty(source,e.target.value)} style={{width:72,padding:'6px',fontWeight:900,textAlign:'center'}}/></>}\n"""
          new = """{source.locked_after_pickup?<><span className=\"badge badge-emerald\">已取貨 {source.picked_up_qty}</span><span style={{fontSize:11}}>原訂購量 {source.qty}（已有取貨紀錄，請勿直接改量）</span></>:<><span style={{fontSize:11}}>訂購量</span><input type=\"number\" min=\"1\" defaultValue={source.qty} onKeyDown={e=>{if(e.key==='Enter')e.currentTarget.blur()}} onBlur={e=>changeSourceQty(source,e.target.value)} style={{width:72,padding:'6px',fontWeight:900,textAlign:'center'}}/></>}{source.can_pickup&&<button type=\"button\" className=\"btn btn-sm btn-primary\" disabled={Boolean(pickupKey)} onClick={()=>markSourcePickedUp(source)}><PackageCheck size={13}/>{pickupKey===`${source.order_id}-${source.item_index}`?'處理中...':'已取貨並隱藏'}</button>}\n"""
          if old not in text:
              raise SystemExit('source render block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          layout = Path('src/components/Layout.jsx')
          ltext = layout.read_text()
          old = "// 第55版：加強取貨流程，保留原品項索引、避免取貨後誤改訂購量，全部完成時自動完成訂單。\nconst APP_VERSION = '第55版｜2026/09/12'"
          new = "// 第56版：混合到貨訂單可逐規格直接標記已取貨並隱藏，未到貨規格繼續保留。\nconst APP_VERSION = '第56版｜2026/09/12'"
          if old not in ltext:
              raise SystemExit('layout version marker not found')
          layout.write_text(ltext.replace(old,new,1))

          registry = Path('src/migration-registry.json')
          data = json.loads(registry.read_text())
          if not any(e.get('version') == 'V56' for e in data.get('entries',[])):
              data['entries'].append({
                'version':'V56',
                'date':'2026-09-12',
                'type':'bugfix',
                'summary':'混合到貨的待出貨訂單可在買家明細中逐規格直接標記「已取貨並隱藏」；已到貨規格可先完成取貨，未到貨規格繼續保留在未出貨報表。',
                'database_changes':[],
                'api_changes':[],
                'ui_changes':[
                  'src/pages/PendingProductReportSql.jsx: 正式預購品項若已到貨且尚未取貨，在訂購量旁新增「已取貨並隱藏」按鈕；寫入既有 OrdersAPI.setItemPickup 後立即重新查詢，該規格從未出貨明細移除。',
                  '同張訂單若仍有未到貨或未取貨規格，訂單維持 pending 並只顯示剩餘規格；全部有效規格完成取貨／釋出後仍沿用 V55 後端自動轉 shipped。'
                ],
                'data_logic':'只對正式、預購、已到貨且尚未取貨的規格提供快捷取貨；取貨數量使用原訂購量扣除已釋出數量後的可取貨量。未到貨規格不顯示此按鈕，避免誤標取貨。沿用既有 picked_up_* 欄位與 set_item_pickup，不修改原銷售額、成本、供應商付款或庫存流水。',
                'data_migration':'無。沿用 V54/V55 已存在的 picked_up_qty / picked_up_at / picked_up_by_uid。',
                'rollback':'移除 PendingProductReportSql 的逐規格「已取貨並隱藏」快捷按鈕與 pickupKey 狀態，APP_VERSION 還原 V55；既有取貨資料不自動清除。'
              })
          registry.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit V56 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PendingProductReportSql.jsx src/components/Layout.jsx src/migration-registry.json
          git commit -m "V56: allow item pickup on mixed-arrival orders"
          git push
