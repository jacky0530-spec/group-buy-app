name: Apply auto finance status patch

on:
  push:
    branches:
      - agent/auto-finance-status-link
    paths:
      - 'scripts/trigger_auto_finance_status.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/auto-finance-status-link
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_auto_finance_status.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/db.js src/pages/Orders.jsx src/pages/PendingProductReport.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Link fulfillment actions to finance statuses'
          git push
