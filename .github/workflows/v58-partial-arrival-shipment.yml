name: V58 partial arrival shipment

on:
  push:
    branches:
      - fix-partial-arrival-shipment-v58

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V58 patch
        run: python .github/scripts/v58_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit V58 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/neon-orders-runtime.js src/pages/PendingProductReportSql.jsx src/pages/PendingProductReportFiltered.jsx src/components/Layout.jsx src/migration-registry.json
          git commit -m "V58: allow partial-arrival item shipment"
          git push
