name: Apply multi-option pricing patch

on:
  push:
    branches:
      - agent/multi-option-pricing-mode
    paths:
      - 'scripts/trigger_multi_option_pricing.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/multi-option-pricing-mode
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_multi_option_pricing.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Products.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Support multi-option product pricing mode'
          git push
