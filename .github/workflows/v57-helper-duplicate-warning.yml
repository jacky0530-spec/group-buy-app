name: V57 helper duplicate warning

on:
  push:
    branches:
      - feature-helper-duplicate-warning-v57

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch exact duplicate warning
        run: python .github/scripts/v57_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit V57 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/neon-helper-runtime.js src/lib/enableNeonHelperReads.js src/pages/HelperPortalV3.jsx src/components/Layout.jsx src/migration-registry.json
          git commit -m "V57: warn helper on exact duplicate pending order"
          git push
