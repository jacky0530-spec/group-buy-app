name: Fix virtual order lint
on:
  push:
    branches:
      - agent/virtual-orders
    paths:
      - scripts/trigger_virtual_lint_fix.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/virtual-orders
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_virtual_orders_lint.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/PendingProductReport.jsx
          git diff --cached --quiet || git commit -m "Fix virtual order lint"
          git push origin HEAD:agent/virtual-orders
