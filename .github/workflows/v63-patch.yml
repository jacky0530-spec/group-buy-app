name: V63 patch

on:
  push:
    branches: [fix-incoming-batch-ship-v63]
    paths:
      - 'scripts/v63_fix_incoming_batch_ship.py'
      - '.github/workflows/v63-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-incoming-batch-ship-v63
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply V63 patch
        run: python scripts/v63_fix_incoming_batch_ship.py
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Remove temporary patch files
        run: |
          rm -f scripts/v63_fix_incoming_batch_ship.py
          rm -f .github/workflows/v63-patch.yml
      - name: Commit V63
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'V63: batch-ship ready orders directly from completed incoming batch'
            git push origin HEAD:fix-incoming-batch-ship-v63
          fi
