name: Apply batch arrival patch

on:
  push:
    branches:
      - agent/batch-arrive-selected

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/batch-arrive-selected
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source patch
        run: python scripts/patch_batch_arrival.py
      - name: Validate
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Orders.jsx src/components/Layout.jsx
          git commit -m "Add batch arrival action for selected orders"
          git push origin HEAD:agent/batch-arrive-selected
