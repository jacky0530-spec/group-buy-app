name: V59 integrated pickup management

on:
  push:
    branches:
      - feature-integrated-pickup-v59

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V59 patch
        run: python .github/scripts/v59_patch.py
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Commit V59 changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/pages/PendingProductReportSql.jsx src/pages/PendingProductReportFiltered.jsx api/neon-orders-runtime.js src/components/Layout.jsx src/migration-registry.json
          git commit -m "V59: integrate pickup management into shipment report"
          git push
