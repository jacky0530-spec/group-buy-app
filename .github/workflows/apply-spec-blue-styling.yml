name: Apply spec blue styling

on:
  push:
    branches:
      - agent/spec-blue-styling
    paths:
      - 'scripts/trigger_spec_blue_styling.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/spec-blue-styling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_spec_blue_styling.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/PendingProductReport.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Use blue styling for all product specs'
          git push
