name: Apply report profit explanation patch

on:
  push:
    branches:
      - agent/report-profit-explanation
    paths:
      - 'scripts/trigger_report_profit_explanation.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/report-profit-explanation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_report_profit_explanation.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/pages/Reports.jsx src/components/Layout.jsx
          git diff --cached --quiet || git commit -m 'Clarify profit calculations in reports'
          git push
