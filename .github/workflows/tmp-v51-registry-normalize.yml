name: Temporary V51 Registry Normalizer

on:
  push:
    branches:
      - fix-ipad-product-deadline-date-v51

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-ipad-product-deadline-date-v51
          fetch-depth: 0
      - name: Normalize registry
        run: python .github/v51_registry_normalize.py
      - name: Commit normalized registry
        run: |
          if git diff --quiet -- src/migration-registry.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migration-registry.json
          git commit -m "docs: normalize V51 registry diff [skip ci]"
          git push origin HEAD:fix-ipad-product-deadline-date-v51
