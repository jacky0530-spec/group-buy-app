<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>團購百貨管理系統</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iPad / Safari 安全列印：不開新視窗，避免 WebKit 因第二個頁面 + print() 造成高記憶體使用或閃退。
      // 點未出貨報表「列印」時，在同一頁建立輕量列印根節點，暫時隱藏 React App，列印完再還原。
      document.addEventListener('click', function (event) {
        if (!location.pathname.includes('/pending-report')) return
        const button = event.target.closest('button')
        if (!button || button.disabled || button.textContent.trim() !== '列印') return

        const source = document.querySelector('.print-only')
        if (!source || !source.innerHTML.trim()) return

        event.preventDefault()
        event.stopPropagation()
        event.stopImmediatePropagation()

        const oldRoot = document.getElementById('fast-print-root')
        if (oldRoot) oldRoot.remove()
        const oldStyle = document.getElementById('fast-print-style')
        if (oldStyle) oldStyle.remove()

        const printRoot = document.createElement('div')
        printRoot.id = 'fast-print-root'
        printRoot.innerHTML = source.innerHTML
        document.body.appendChild(printRoot)

        const style = document.createElement('style')
        style.id = 'fast-print-style'
        style.textContent = `
          body.fast-pending-print > #root { display: none !important; }
          body.fast-pending-print > #fast-print-root {
            display: block !important;
            margin: 0;
            padding: 0;
            background: #fff;
            color: #1e293b;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
            font-size: 12px;
          }
          #fast-print-root { display: none; }
          #fast-print-root h2 { font-size: 20px; margin: 0 0 6px; }
          #fast-print-root h3 { font-size: 16px; margin: 14px 0 8px; }
          #fast-print-root table { width: 100%; border-collapse: collapse; margin-top: 8px; }
          #fast-print-root th, #fast-print-root td {
            border: 1px solid #d9e0e8;
            padding: 6px 7px;
            text-align: left;
            vertical-align: top;
          }
          #fast-print-root th { background: #f5f7fa; font-size: 11px; }
          #fast-print-root tr { break-inside: avoid; page-break-inside: avoid; }
          #fast-print-root tfoot td { font-weight: 800; }
          #fast-print-root small { color: #64748b; }
          #fast-print-root span[style*="dc2626"] { color: #c81e1e !important; font-weight: 900 !important; }
          @media print {
            @page { size: A4 portrait; margin: 10mm; }
            html, body { margin: 0 !important; padding: 0 !important; background: #fff !important; height: auto !important; }
            body.fast-pending-print > #root { display: none !important; }
            body.fast-pending-print > #fast-print-root { display: block !important; }
            #fast-print-root * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
          }
        `
        document.head.appendChild(style)
        document.body.classList.add('fast-pending-print')

        let cleaned = false
        const cleanup = () => {
          if (cleaned) return
          cleaned = true
          document.body.classList.remove('fast-pending-print')
          printRoot.remove()
          style.remove()
        }

        window.addEventListener('afterprint', cleanup, { once: true })
        // 極端情況 afterprint 未觸發時的保險；列印視窗開啟期間 Safari 會暫停此計時器。
        setTimeout(cleanup, 120000)

        try {
          window.print()
        } catch (error) {
          cleanup()
          console.error('列印失敗', error)
        }
      }, true)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
