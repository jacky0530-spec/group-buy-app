<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>團購百貨管理系統</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // iPad / Safari：未出貨報表使用獨立列印文件，並在同一次點擊事件內直接呼叫 print()。
      // Safari 偶爾仍會攔截自動列印，因此列印頁保留一個手動「再次列印」按鈕作為可靠備援。
      document.addEventListener('click', function (event) {
        if (!location.pathname.includes('/pending-report')) return
        const button = event.target.closest('button')
        if (!button || button.disabled || button.textContent.trim() !== '列印') return

        const source = document.querySelector('.print-only')
        if (!source || !source.innerHTML.trim()) return

        event.preventDefault()
        event.stopPropagation()
        event.stopImmediatePropagation()

        const printWindow = window.open('', '_blank')
        if (!printWindow) {
          window.print()
          return
        }

        printWindow.document.open()
        printWindow.document.write(`<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>未出貨查詢報表</title>
<style>
  @page { size: A4 portrait; margin: 10mm; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif; font-size: 12px; }
  body { padding: 0; }
  .print-toolbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; margin: 0 0 12px; background: #eef2ff; border: 1px solid #c7d2fe; border-radius: 10px; color: #3730a3; }
  .print-toolbar button { border: 0; border-radius: 8px; padding: 9px 16px; background: #4f46e5; color: #fff; font: inherit; font-weight: 800; cursor: pointer; white-space: nowrap; }
  h2 { font-size: 20px; margin: 0 0 6px; }
  h3 { font-size: 16px; margin: 14px 0 8px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  th, td { border: 1px solid #d9e0e8; padding: 6px 7px; text-align: left; vertical-align: top; }
  th { background: #f5f7fa; font-size: 11px; }
  tr { break-inside: avoid; page-break-inside: avoid; }
  tfoot td { font-weight: 800; }
  small { color: #64748b; }
  span[style*="dc2626"] { color: #c81e1e !important; font-weight: 900 !important; }
  @media print {
    .print-toolbar { display: none !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>
  <div class="print-toolbar">
    <span>若列印預覽沒有自動出現，請按右側按鈕。</span>
    <button type="button" onclick="window.print()">🖨 再次列印</button>
  </div>
  ${source.innerHTML}
</body>
</html>`)
        printWindow.document.close()

        try {
          // 不使用 setTimeout / requestAnimationFrame，避免 Safari 將 print() 判定為脫離使用者點擊事件。
          printWindow.focus()
          printWindow.print()
        } catch (error) {
          console.error('自動列印被瀏覽器攔截，可在列印頁按「再次列印」', error)
        }
      }, true)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
